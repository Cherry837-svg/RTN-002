 
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zhivoy bloknot</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      height: 100%;
      background-color: #fbf9f6f8;
      color: #1a0303;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #editor {
      width: 100%;
      height: 100%;
      padding: 20px;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.6;
      resize: none;
    }
    #status-bar {
      position: fixed;
      bottom: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px; 
      color: #faf7f7;
      background: rgba(5, 3, 0, 0.886);
      padding: 6px 12px;
      border-radius: 20px;
      pointer-events: none;
    }
    #dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #ef4444;
    }
    #dot.online {
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>

  <textarea id="editor" placeholder="Nachni pechatat... Dvoynoy tap - polnyy ekran"></textarea>
  
  <div id="status-bar">
    <div id="dot"></div>
    <span id="status-text">Podklyuchenie...</span>
  </div>

  <script>
    const TOPIC = 'cherry837/rtn002/2026/live8821';
    const CLIENT_ID = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);

    const editor = document.getElementById('editor');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');

    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: CLIENT_ID,
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 2000
    });

    client.on('connect', () => {
      dot.classList.add('online');
      statusText.innerText = 'Onlayn';
      client.subscribe(TOPIC, { qos: 0 });
    });

    client.on('reconnect', () => {
      dot.classList.remove('online');
      statusText.innerText = 'Perepodklyuchenie...';
    });

    client.on('offline', () => {
      dot.classList.remove('online');
      statusText.innerText = 'Oflayn';
    });

    client.on('error', () => {
      dot.classList.remove('online');
      statusText.innerText = 'Oshibka svyazi';
    });

    client.on('message', (topic, message) => {
      if (topic !== TOPIC) return;
      try {
        const data = JSON.parse(message.toString());
        if (data.sender !== CLIENT_ID && typeof data.text === 'string') {
          if (editor.value !== data.text) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = data.text;
            editor.setSelectionRange(start, end);
          }
        }
      } catch (e) {}
    });

    editor.addEventListener('input', () => {
      if (client.connected) {
        const payload = JSON.stringify({
          sender: CLIENT_ID,
          text: editor.value
        });
        client.publish(TOPIC, payload, { qos: 0, retain: true });
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    editor.addEventListener('dblclick', toggleFullScreen);

    let lastTap = 0;
    editor.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        e.preventDefault();
        toggleFullScreen();
      }
      lastTap = currentTime;
    });
  </script>

</body>
</html>
