<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zhivoy Bloknot</title>
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      height: 100%;
      width: 100%;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #editor {
      width: 100%;
      height: 100%;
      padding: 20px;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.6;
      resize: none;
    }
    #hint {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 12px;
      color: #666666;
      pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>

  <textarea id="editor" placeholder="Nachni pechatat... Dvoynoy tap - na ves ekran"></textarea>
  <div id="hint">Dvoynoy tap - polnyy ekran</div>

  <script>
    // Aktualnye relay-servery Gun.js
    const gun = Gun([
      'https://peer.wallie.io/gun',
      'https://gundb-relay-mlccl.ondigitalocean.app/gun'
    ]);

    // Tvoy unikalnyy klyuch (mozhno zamenit na lyuboe svoe slovo)
    const NOTE_ID = 'cherry837-bloknot-2026';
    const note = gun.get(NOTE_ID);

    const editor = document.getElementById('editor');
    let isRemoteUpdate = false;

    // Otpravka teksta pri pechati
    editor.addEventListener('input', () => {
      if (!isRemoteUpdate) {
        note.put({ text: editor.value });
      }
    });

    // Poluchenie teksta s drugikh ustroystv v realnom vremeni
    note.on((data) => {
      if (data && data.text !== undefined && data.text !== editor.value) {
        const cursorStart = editor.selectionStart;
        const cursorEnd = editor.selectionEnd;
        isRemoteUpdate = true;
        editor.value = data.text;
        editor.setSelectionRange(cursorStart, cursorEnd);
        isRemoteUpdate = false;
      }
    });

    // Dvoynoy tap / klik - polnyy ekran
    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    editor.addEventListener('dblclick', toggleFullScreen);

    let lastTap = 0;
    editor.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        e.preventDefault();
        toggleFullScreen();
      }
      lastTap = currentTime;
    });
  </script>

</body>
</html>
